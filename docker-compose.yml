services:
  app:
    build: .
    image: lead-triage
    ports:
      - "8000:8000"
    environment:
      # Pointing at the db service switches the app from SQLite to Postgres.
      # The hostname "db" is the service name below - compose resolves it on
      # the shared network.
      DATABASE_URL: postgresql://leads:${POSTGRES_PASSWORD:-leads}@db:5432/leads
      # demo = deterministic keyword classification, no API calls. Switching to
      # live is only useful together with OPENAI_API_KEY.
      LEAD_TRIAGE_MODE: ${LEAD_TRIAGE_MODE:-demo}
      # Without a token the app generates one and logs it at startup.
      LEAD_TRIAGE_TOKEN: ${LEAD_TRIAGE_TOKEN:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
    depends_on:
      db:
        # Not just "started": Postgres accepts connections a moment after the
        # container is up, and the app creates its schema during startup.
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: leads
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-leads}
      POSTGRES_DB: leads
    volumes:
      # Mounted at /var/lib/postgresql, not at .../data: from 18 on these images
      # keep the cluster in a version-specific subdirectory, so a mount on the
      # old path is ignored and the container refuses to start rather than
      # quietly writing somewhere else.
      - leads-db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leads -d leads"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    # No ports published: only the app needs to reach the database, and it
    # reaches it over the compose network. To inspect it with psql, add
    # `ports: ["127.0.0.1:5432:5432"]` - with the address, not just the port.
    # Plain "5432:5432" binds to 0.0.0.0 and would put a database whose password
    # defaults to "leads" on every interface this machine has.

volumes:
  leads-db:
