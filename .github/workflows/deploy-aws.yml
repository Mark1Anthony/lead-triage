name: Deploy to AWS

# Builds the Lambda image, pushes it to ECR and points the function at it.
#
# The job is skipped, not failed, until AWS_ROLE_ARN is set as a repository
# variable - that value comes out of `terraform output cicd_role_arn` and does
# not exist before the stack has been applied once. A workflow that failed on
# every push until then would be noise, not a signal.

permissions:
  contents: read
  id-token: write # required for the OIDC token exchange; nothing else needs it

on:
  push:
    branches: [main]
    paths:
      - 'app.py'
      - 'db.py'
      - 'triage.py'
      - 'security.py'
      - 'lambda_handler.py'
      - 'templates/**'
      - 'requirements*.txt'
      - 'scripts/build-lambda.sh'
      - '.github/workflows/deploy-aws.yml'
  workflow_dispatch:

jobs:
  deploy:
    if: vars.AWS_ROLE_ARN != '' && vars.AWS_API_URL != ''
    runs-on: ubuntu-latest

    # Deliberately no `environment:`. Naming one changes the subject GitHub puts
    # in the OIDC token from repo:owner/name:ref:refs/heads/main to
    # repo:owner/name:environment:<name>, and the role's trust policy binds to
    # the branch. The result is an AssumeRoleWithWebIdentity refusal that says
    # only "not authorized" - found by running it, not by reading it.
    #
    # An environment would buy approval gates. The trust policy would then have
    # to name the environment instead of the branch, and the branch is the
    # tighter statement for a repository with one deploy path.

    steps:
      - uses: actions/checkout@v4

      # No access key anywhere. The workflow's own token is exchanged for
      # short-lived AWS credentials against a role that trusts this repository
      # and this branch only.
      - name: Authenticate to AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: eu-central-1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build the deployment package
        run: |
          scripts/build-lambda.sh
          cd build && zip -qr ../lambda.zip . && cd ..
          ls -lh lambda.zip

      - name: Ship it
        run: |
          aws lambda update-function-code \
            --function-name lead-triage \
            --zip-file fileb://lambda.zip \
            --publish \
            --no-cli-pager > /dev/null

          # update-function-code returns before the new package is live.
          aws lambda wait function-updated --function-name lead-triage

      # The URL comes from a repository variable, not from asking AWS. Looking
      # it up needs apigateway:GET, and that cannot be scoped to one API - the
      # list operation reads every API in the account. A pipeline does not need
      # permission to enumerate an account to learn its own address, and the
      # address is not a secret.
      - name: It answers, on DynamoDB
        env:
          URL: ${{ vars.AWS_API_URL }}
        run: |
          for i in $(seq 1 10); do
            health=$(curl -fsS -m 15 "$URL/health") && break
            sleep 5
          done
          echo "$health"

          echo "$health" | grep -q '"database":"dynamodb"' \
            || { echo "expected dynamodb; the table variable did not reach the function"; exit 1; }

      - name: Writes stay closed without a token
        env:
          URL: ${{ vars.AWS_API_URL }}
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' -X DELETE "$URL/leads/1")
          [ "$code" = "401" ] || { echo "expected 401, got $code"; exit 1; }
