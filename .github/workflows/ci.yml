name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # The same suite three times, once per backend. All three ship - SQLite for a
  # local run, Postgres on Render and in compose, DynamoDB in Lambda - so all
  # three are tested rather than the one that happens to be convenient.
  #
  # DynamoDB needs no AWS account: moto answers botocore in-process, so the
  # code under test is the same code the deployed function runs.
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - backend: sqlite
          - backend: postgres
          - backend: dynamodb

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Start Postgres
        if: matrix.backend == 'postgres'
        run: |
          docker run -d --name pg \
            -e POSTGRES_USER=leads -e POSTGRES_PASSWORD=leads -e POSTGRES_DB=leads \
            -p 5432:5432 postgres:18-alpine
          for i in $(seq 1 30); do
            docker exec pg pg_isready -U leads -d leads && break
            sleep 2
          done

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Run tests
        env:
          TEST_DATABASE_URL: ${{ matrix.backend == 'postgres' && 'postgresql://leads:leads@localhost:5432/leads' || '' }}
          TEST_DYNAMODB: ${{ matrix.backend == 'dynamodb' && '1' || '' }}
        run: pytest -q

      - name: Import check
        run: python -c "import app, db, triage, security"

  # The Terraform is never applied by CI - that needs credentials and creates
  # billable resources. What CI can do is prove it is valid, formatted and free
  # of the mistakes a scanner catches, which is the difference between code
  # that has been reviewed and code that has only been written.
  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Formatting
        run: terraform fmt -check -recursive terraform/

      - name: Syntax and provider schemas
        run: |
          terraform -chdir=terraform init -backend=false -input=false
          terraform -chdir=terraform validate

      - uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: latest

      - name: Lint
        run: |
          cd terraform
          tflint --init
          tflint --minimum-failure-severity=warning

      - name: Security scan
        uses: bridgecrewio/checkov-action@master
        with:
          directory: terraform
          framework: terraform
          quiet: true
          output_format: cli
          soft_fail: false

  # Proves the deployment package works on the runtime it targets. The build
  # runs on any operating system, so the failure it has to catch is a package
  # that builds fine and then cannot be imported - a wheel for the wrong Python
  # or the wrong platform. On a Linux runner with the matching interpreter,
  # importing the handler settles that before AWS ever sees it.
  lambda-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Must match PYTHON_VERSION in the build script and the runtime in
          # terraform/variables.tf.
          python-version: '3.11'

      - name: Build
        run: scripts/build-lambda.sh

      - name: The handler imports
        run: |
          cd build
          python -c "import lambda_handler; print(type(lambda_handler.handler).__name__)"

      - name: It answers a request
        run: |
          cd build
          python - <<'PY'
          import json
          import lambda_handler

          event = {
              "version": "2.0",
              "rawPath": "/health",
              "rawQueryString": "",
              "headers": {"host": "example.com"},
              "requestContext": {
                  "http": {"method": "GET", "path": "/health",
                           "protocol": "HTTP/1.1", "sourceIp": "203.0.113.1"},
                  "stage": "$default",
              },
              "body": None,
              "isBase64Encoded": False,
          }
          response = lambda_handler.handler(event, None)
          print(response["statusCode"], response["body"])
          assert response["statusCode"] == 200, response
          # No DYNAMODB_TABLE here, so it falls back to SQLite - which is the
          # point: the package runs, the backend is a deployment decision.
          assert json.loads(response["body"])["status"] == "ok"
          PY

      - name: Size, because it is cold-start time
        run: |
          cd build && zip -qr ../lambda.zip . && cd ..
          size=$(stat -c %s lambda.zip)
          echo "$((size / 1024 / 1024)) MB zipped, $(du -sh build | cut -f1) unpacked"
          # 50 MB is the direct-upload limit; well before that it is just slow.
          [ "$size" -lt 26214400 ] || { echo "package over 25 MB"; exit 1; }

  # Build the image and prove the container actually serves traffic, rather
  # than only that the Dockerfile parses.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t lead-triage .

      - name: Start the full stack
        run: docker compose up -d --wait

      - name: The app answers and reports its backend
        run: |
          health=$(curl -fsS --retry 10 --retry-all-errors --retry-delay 3 http://localhost:8000/health)
          echo "$health"
          echo "$health" | grep -q '"database":"postgres"' \
            || { echo "expected the compose stack to use postgres"; exit 1; }

      - name: The dashboard renders and the seed ran
        run: |
          curl -fsS http://localhost:8000/ | grep -q "Nord Capital" \
            || { echo "seed rows missing from the dashboard"; exit 1; }

      - name: Writes are closed without a token
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' -X DELETE http://localhost:8000/leads/1)
          [ "$code" = "401" ] || { echo "expected 401, got $code"; exit 1; }

      - name: The public form still works
        run: |
          curl -fsS -X POST http://localhost:8000/demo-lead \
            -F name=CI -F company=Pipeline -F 'message=budget approved, urgent' \
            | grep -q '"priority":"hot"' \
            || { echo "demo-lead did not classify as hot"; exit 1; }

      # The volume is the only reason the database outlives the container, and a
      # wrong mount path fails quietly on some versions - so check the data is
      # really still there rather than trusting the mount.
      - name: Leads survive a restart
        run: |
          docker compose down
          docker compose up -d --wait
          curl -fsS --retry 10 --retry-all-errors --retry-delay 3 http://localhost:8000/             | grep -q "Pipeline"             || { echo "the lead created before the restart is gone"; exit 1; }

      - name: Logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down -v
